# Prometheus for Healix — scrapes cAdvisor (container CPU/mem) and the
# demo load generator (synthetic backlog gauge the scaler scales on).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["healix-primary-control-plane:8080"]

  - job_name: demo-load
    static_configs:
      - targets: ["healix-primary-control-plane:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
