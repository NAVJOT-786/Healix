# ──────────────────────────────────────────────────────────────────────────────
# AI Healing Agent v9 — Docker Compose (with PostgreSQL + circuit breaker)
# ──────────────────────────────────────────────────────────────────────────────
# Run:  docker compose up -d --build
#
# The watchdog monitors the agent process and restarts it if it crashes.
# On restart, the agent detects the recovery and sends a self-heal email.
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-healer-db
    environment:
      POSTGRES_USER: healer
      POSTGRES_PASSWORD: healer
      POSTGRES_DB: healer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-healer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-healer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    # ── Environment ────────────────────────────────────────────────
    env_file:
      - .env

    environment:
      - ENABLE_DOCKER=true
      - ENABLE_K8S=true
      - WATCHDOG_INTERVAL_SEC=10
      - AGENT_MARKER_DIR=/tmp
      - DATABASE_URL=postgresql://healer:healer@localhost:5432/healer

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${HEALTH_PORT:-8080}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # ── Volumes ────────────────────────────────────────────
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.kube/config:/home/agent/.kube/config:ro

    # ── Networking ─────────────────────────────────────────────────
    network_mode: host

    # ── Resource limits ────────────────────────────────────────────
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

    # ── Logging ────────────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
